name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

jobs:
  Warp_Chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4.7.1
        with:
          python-version: '3.10'
      - name: prepare env
        run: |
          python3 -m pip install -r requirements.txt
          python3 run.py
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_NAME }}
          name: Chrome Portable ${{ env.BUILD_NAME }}
          prerelease: true
          files: build/release/*.7z
          generate_release_notes: false
          body: |
            ## Google Chrome 便携版

            解压后为 Chrome 文件夹，为 Chrome.exe 创建快捷方式即可使用。

            - 数据目录：Chrome\Data
            - 缓存目录：Chrome\Cache
            - 配置文件：Chrome\chrome++.ini

            > 每周一自动构建，历史版本均保留在 Releases 页面。
